apiVersion: v1
kind: Pod
metadata:
  name: emptydir-test-pod
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: temporary-storage
          mountPath: /data

  volumes:
    - name: temporary-storage
      emptyDir: {}
