apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: employee-api

  template:
    metadata:
      labels:
        app: employee-api

    spec:
      containers:
        - name: employee-api
          image: employee-api:v16
          imagePullPolicy: IfNotPresent

          # CPU and memory required for scheduling
          # Limits control the maximum permitted usage
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Load environment variables from our ConfigMap
          envFrom:
            - configMapRef:
                name: employee-api-config

          # Load the API key from Kubernetes Secret
          env:
            - name: EMPLOYEE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: employee-api-secret
                  key: EMPLOYEE_API_KEY

          ports:
            - containerPort: 8000

          # Restart the container if the application stops responding
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Allow Service traffic only when the application is ready
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          # Allow the application time to finish starting
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
