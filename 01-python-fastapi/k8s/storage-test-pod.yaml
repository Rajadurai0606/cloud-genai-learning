apiVersion: v1
kind: Pod
metadata:
  name: storage-test-pod
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: employee-storage
          mountPath: /data

  volumes:
    - name: employee-storage
      persistentVolumeClaim:
        claimName: employee-storage-pvc
